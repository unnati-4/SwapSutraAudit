<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Pinch-zoom is deliberately allowed. This used to carry
         `maximum-scale=1.0, user-scalable=no`, which blocks zoom entirely —
         a WCAG 1.4.4 failure, and a daily obstacle for older readers and
         anyone who enlarges text to read comfortably. On a site built for
         readers, that was the wrong default. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="SwapSutra is a reader-first community in India where you can swap, lend, rent and share physical books with readers near you." />
    <!-- SwapSutra has one light look. theme-color is the real --bg-page token
         from index.css, so the OS status bar meets the page with no seam, and
         color-scheme keeps phones in system dark mode from darkening form
         controls and scrollbars. -->
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="color-scheme" content="light only" />
    <!-- 30 Sep: SwapSutra is a normal website, not an installable app (PWA).
         The manifest, home-screen icons and iOS app-mode tags are
         gone; viewport-fit=cover and the safe-area padding stay because they
         also keep the bottom bar clear of the notch in a normal browser. -->
    <title>SwapSutra | Share Books With Readers Near You</title>

    <!-- Link previews. Without these, a listing shared to WhatsApp — the
         way this kind of community actually spreads in India — arrived as
         a bare URL with no title, image or description. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SwapSutra" />
    <meta property="og:title" content="SwapSutra | Share Books With Readers Near You" />
    <meta property="og:description" content="Swap, lend, rent and share physical books with readers in your neighbourhood. Keep your books travelling." />
    <meta property="og:image" content="/swapsutra-logo.png" />
    <meta property="og:image:alt" content="The SwapSutra logo" />
    <meta property="og:locale" content="en_IN" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SwapSutra | Share Books With Readers Near You" />
    <meta name="twitter:description" content="Swap, lend, rent and share physical books with readers in your neighbourhood." />
    <meta name="twitter:image" content="/swapsutra-logo.png" />

    <!-- Fonts load in parallel with the page instead of from inside the CSS
         (an @import there blocked the first paint). Only the two families
         the typography tokens use (index.css §0): Cormorant Garamond for
         display, Source Sans 3 for body and UI — and only the weights used. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" />

    <link rel="icon" type="image/png" href="/swapsutra-logo.png?v=4" />
    <link rel="shortcut icon" type="image/png" href="/swapsutra-logo.png?v=4" />
  </head>
  <body>
    <!-- Lets keyboard and screen-reader users jump past the whole nav
         instead of tabbing through it on every page. Visually hidden
         until focused. -->
    <a href="#main-content" class="skip-to-content">Skip to main content</a>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
